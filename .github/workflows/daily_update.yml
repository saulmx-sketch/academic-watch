name: Actualizar RSS Académico

on:
  schedule:
    # 11:23 UTC = 5:23 de la mañana en Ciudad de México. El minuto raro evita la
    # fila de las horas en punto, donde GitHub retrasa o tira corridas.
    - cron: '23 11 * * *'
  workflow_dispatch: # botón "Run workflow" para correrlo a mano
  push: # al editar la lista de revistas o el programa, el feed se regenera solo
    branches: [main]
    paths: ['revistas.txt', 'main.py', '.github/workflows/daily_update.yml']

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v7

      - name: Generar feed.xml e index.html
        id: feed
        run: python3 main.py
        env:
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}

      - name: Guardar cambios
        # corre aunque el paso anterior avise de un ISSN malo: lo demás sí se publica
        if: ${{ !cancelled() }}
        run: |
          git add feed.xml index.html
          if git diff --staged --quiet; then
            echo "Sin novedades: no hay nada que guardar."
            exit 0
          fi
          git config user.name 'AcademicBot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Actualizar feed (+${{ steps.feed.outputs.nuevos || 0 }})"
          git push || (git pull --rebase && git push)
